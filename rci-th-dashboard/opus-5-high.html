function renderInvTable() {
  const cols = [
    { k: 'name', l: LANG === 'ms' ? 'Pelaburan' : 'Investment' },
    { k: 'sector', l: U('l_sector') },
    { k: 'year', l: U('year') },
    { k: 'invested', l: U('l_invested') },
    { k: 'loss', l: U('l_loss') },
    { k: 'status', l: U('l_status') }
  ];
  const rows = filteredInv().slice().sort((a, b) => {
    const k = ST.sortKey, d = ST.sortDir === 'asc' ? 1 : -1;
    let x = a[k], y = b[k];
    if (k === 'sector') { x = t(DATA.sectors[a.sector].label); y = t(DATA.sectors[b.sector].label); }
    if (k === 'status') { x = t(a.status); y = t(b.status); }
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return typeof x === 'number' ? (x - y) * d : String(x).localeCompare(String(y)) * d;
  });
  setHTML('invTbl', `<table class="dt"><thead><tr>${cols.map(c =>
    `<th class="sortable" data-k="${c.k}"${ST.sortKey === c.k ? ` data-dir="${ST.sortDir}"` : ''}>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>` +
    (rows.length ? rows.map(r => `<tr>
      <td>${esc(r.name)}</td>
      <td><span class="swatch" style="display:inline-block;background:${DATA.sectors[r.sector].color};margin-right:6px;vertical-align:middle"></span>${esc(t(DATA.sectors[r.sector].label))}</td>
      <td>${r.year || '—'}</td>
      <td>${r.invested ? rmMil(r.invested, 1) : '—'}</td>
      <td style="color:var(--critical);font-weight:650">${r.loss ? rmMil(r.loss, 1) : '—'}</td>
      <td style="white-space:normal;max-width:340px;font-size:12px">${esc(t(r.status))}</td></tr>`).join('')
      : `<tr><td colspan="6" style="text-align:center;padding:24px">${U('none')}</td></tr>`) +
    `</tbody></table>`);
  document.querySelectorAll('#invTbl th.sortable').forEach(th =>
    th.addEventListener('click', () => {
      if (ST.sortKey === th.dataset.k) ST.sortDir = ST.sortDir === 'asc' ? 'desc' : 'asc';
      else { ST.sortKey = th.dataset.k; ST.sortDir = 'desc'; }
      renderInvTable();
    }));
}

/* ---------- 6. HAFIS ---------- */
function buildHafis() {
  const H = DATA.hafis.filter(d => d.pays !== null);
  const S = [
    { name: U('l_pays'), color: C(1), values: H.map(d => d.pays) },
    { name: U('l_subsidy'), color: 'var(--serious)', values: H.map(d => d.subsidy) }
  ];
  legend('hafLegend', S);
  const fcIdx = H.findIndex(d => d.proj);
  stackedArea('hafChart', {
    x: H.map(d => String(d.year)), series: S, height: 320,
    tick: { compact: true }, fmt: v => rm(v, 0), aria: U('c_haf_t'),
    forecastFrom: fcIdx, forecastLabel: LANG === 'ms' ? 'unjuran' : 'projected',
    totalLabel: U('l_totalcost'),
    notes: H.map(d => `${U('l_subsidy')}: <b>${NF(d.pct, 1)}%</b> ${LANG === 'ms' ? 'daripada kos' : 'of cost'}${d.proj ? (LANG === 'ms' ? ' · unjuran' : ' · projected') : ''}`)
  });
  dataTable('hafTbl',
    [U('year'), U('l_totalcost'), U('l_pays'), U('l_subsidy'), '% ' + (LANG === 'ms' ? 'kos' : 'of cost'), LANG === 'ms' ? 'Jumlah HAFIS' : 'Total HAFIS'],
    DATA.hafis.map(d => [d.year + (d.proj ? '*' : ''), rm(d.cost, 0), rm(d.pays, 0), rm(d.subsidy, 0), d.pct ? NF(d.pct, 1) + '%' : '—', d.total ? rmMil(d.total, 1) : '—']));

  const HT = DATA.hafis.filter(d => d.total !== null);
  columnChart('hafTotalChart', {
    mode: 'grouped', series: [{ name: LANG === 'ms' ? 'Jumlah HAFIS' : 'Total HAFIS', color: 'var(--serious)' }],
    height: 250, tick: { compact: true }, fmt: v => rmMil(v, 0), aria: U('c_haft_t'),
    data: HT.map(d => ({
      label: String(d.year).slice(2), tipTitle: String(d.year), values: [d.total],
      note: d.proj ? (LANG === 'ms' ? 'Unjuran Suruhanjaya.' : 'Commission projection.') : null
    }))
  });
  setHTML('hafFoot', LANG === 'ms'
    ? `Menjelang 2030 HAFIS dijangka mencecah <b>RM742.5 juta setahun</b> — <b>65.6%</b> daripada kos haji sebenar. Suruhanjaya menganggarkan LTH memerlukan asas deposit minimum <b>RM${DATA.hafisMeta.minFund} bilion</b> semata-mata untuk menampungnya.`
    : `By 2030 HAFIS is projected to reach <b>RM742.5 million a year</b> — <b>65.6%</b> of the true cost of hajj. The Commission estimates LTH needs a minimum deposit base of <b>RM${DATA.hafisMeta.minFund} billion</b> just to carry it.`);
}

/* ---------- 9. RECOMMENDATIONS ---------- */
function buildRecFilters() {
  const cats = [['all', U('all')]].concat(Object.entries(DATA.recCats).map(([k, v]) => [k, t(v.label)]));
  const pris = [['all', U('all')], ['high', U('l_high')], ['medium', U('l_medium')], ['low', U('l_low')]];
  setHTML('recFilters',
    `<span class="filter-label">${LANG === 'ms' ? 'Kategori' : 'Category'}</span>` +
    cats.map(([k, l]) => `<button class="chip" data-rc="${k}" aria-pressed="${ST.recCat === k}">${esc(l)}</button>`).join('') +
    `<span style="width:10px"></span><span class="filter-label">${U('l_priority')}</span>` +
    pris.map(([k, l]) => `<button class="chip" data-rp="${k}" aria-pressed="${ST.recPri === k}">${esc(l)}</button>`).join(''));
  document.querySelectorAll('#recFilters [data-rc]').forEach(b =>
    b.addEventListener('click', () => { ST.recCat = b.dataset.rc; renderRecs(); }));
  document.querySelectorAll('#recFilters [data-rp]').forEach(b =>
    b.addEventListener('click', () => { ST.recPri = b.dataset.rp; renderRecs(); }));
}
function renderRecs() {
  document.querySelectorAll('#recFilters [data-rc]').forEach(b => b.setAttribute('aria-pressed', String(ST.recCat === b.dataset.rc)));
  document.querySelectorAll('#recFilters [data-rp]').forEach(b => b.setAttribute('aria-pressed', String(ST.recPri === b.dataset.rp)));
  const list = DATA.recommendations.filter(r =>
    (ST.recCat === 'all' || r.cat === ST.recCat) && (ST.recPri === 'all' || r.priority === ST.recPri));
  setHTML('recList', list.length ? list.map(r =>
    `<div class="rec">
      <div class="rec-n">${r.num}</div>
      <div class="rec-body">
        <p style="margin-top:0;color:var(--text-primary);font-size:13.5px;line-height:1.55">${esc(t(r.text))}</p>
        <div class="rec-tags">
          <span class="pill info">${esc(t(DATA.recCats[r.cat].label))}</span>
          <span class="pill info">${U('l_target')}: ${esc(t(r.target))}</span>
          ${priPill(r.priority)}
        </div>
      </div>
    </div>`).join('') : `<div class="card">${U('none')}</div>`);
}

/* =============================================================
   ORCHESTRATION
   ============================================================= */
function resetChartsIn(id) {
  const box = document.getElementById(id);
  if (box) box.querySelectorAll('svg,.tip').forEach(n => n.remove());
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(n => {
    const v = UI[n.dataset.i18n];
    if (v) n.innerHTML = t(v);
  });
  document.documentElement.lang = LANG === 'ms' ? 'ms' : 'en';
  document.title = LANG === 'ms'
    ? 'Laporan RCI Tabung Haji — Dashboard Interaktif'
    : 'Tabung Haji RCI Report — Interactive Dashboard';
}

function buildAll() {
  resetCharts();
  document.querySelectorAll('.chartbox').forEach(b => b.querySelectorAll('svg,.tip').forEach(n => n.remove()));
  applyI18n();
  buildNav(); buildHero(); buildKPI();
  buildGap(); buildHibah(); buildAccounting(); buildBailout();
  buildInvFilters(); renderInv();
  buildHafis(); buildGovernance(); buildAccountability();
  buildRecFilters(); renderRecs();
  buildTlFilters(); renderTl();
  buildFooter();
  wireTables();
  observeCharts();
}

function wireTables() {
  document.querySelectorAll('.tbl-toggle').forEach(b => {
    const w = document.getElementById(b.dataset.tbl);
    b.textContent = w && w.classList.contains('on') ? U('tblHide') : U('tblShow');
    if (b.dataset.wired) return;
    b.dataset.wired = '1';
    b.addEventListener('click', () => {
      const wrap = document.getElementById(b.dataset.tbl);
      const on = wrap.classList.toggle('on');
      b.textContent = on ? U('tblHide') : U('tblShow');
    });
  });
}

/* ---------- controls ---------- */
function setLang(l) {
  LANG = l;
  localStorage.setItem('rci-lang', l);
  document.getElementById('langMs').setAttribute('aria-pressed', String(l === 'ms'));
  document.getElementById('langEn').setAttribute('aria-pressed', String(l === 'en'));
  buildAll();
}
function initTheme() {
  const saved = localStorage.getItem('rci-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeBtn');
  const sync = () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    btn.setAttribute('aria-pressed', String(dark));
    btn.textContent = dark ? '☾' : '☀';
  };
  btn.addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('rci-theme', next);
    sync();
  });
  sync();
}
function initScrollSpy() {
  const links = () => Array.from(document.querySelectorAll('#secnav a'));
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links().forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id)));
      const cur = links().find(a => a.getAttribute('href') === '#' + e.target.id);
      if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
  }, { rootMargin: '-96px 0px -68% 0px', threshold: 0 });
  SECTIONS.forEach(([id]) => { const n = document.getElementById(id); if (n) obs.observe(n); });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langMs').addEventListener('click', () => setLang('ms'));
  document.getElementById('langEn').addEventListener('click', () => setLang('en'));
  document.getElementById('langMs').setAttribute('aria-pressed', String(LANG === 'ms'));
  document.getElementById('langEn').setAttribute('aria-pressed', String(LANG === 'en'));
  initTheme();
  buildAll();
  initScrollSpy();
});
</script>
