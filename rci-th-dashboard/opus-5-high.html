<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan RCI Tabung Haji — Dashboard Interaktif</title>
<meta name="description" content="Dashboard interaktif Laporan Suruhanjaya Siasatan Diraja Lembaga Tabung Haji 2014–2020: kadar hibah, jurang aset-liabiliti, pelaburan bermasalah, bailout UJSB, HAFIS dan 35 cadangan Suruhanjaya.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Laporan RCI Tabung Haji — Dashboard Interaktif">
<meta property="og:description" content="Setiap angka utama dalam Laporan RCI Tabung Haji, disusun semula supaya coraknya boleh dilihat.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><text x='16' y='22' font-family='system-ui' font-size='14' font-weight='700' fill='white' text-anchor='middle'>TH</text></svg>">
<style>
/* ============================================================
   RCI Tabung Haji — Dashboard
   Palette: dataviz reference instance (validated light + dark)
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;

  --surface-1:      #fcfcfb;
  --surface-2:      #f4f3ef;
  --page:           #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --border-strong:  rgba(11,11,11,0.18);
  --shadow:         0 1px 2px rgba(11,11,11,0.05), 0 8px 24px -12px rgba(11,11,11,0.14);

  --series-1: #2a78d6;  /* biru    */
  --series-2: #eb6834;  /* jingga  */
  --series-3: #1baf7a;  /* akua    */
  --series-4: #eda100;  /* kuning  */
  --series-5: #e87ba4;  /* magenta */
  --series-6: #008300;  /* hijau   */
  --series-7: #4a3aa7;  /* ungu    */
  --series-8: #e34948;  /* merah   */

  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --good-ink: #006300;

  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec;
  --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;

  --ff: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --radius-sm: 9px;
  --maxw: 1240px;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #222220;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --border-strong:  rgba(255,255,255,0.20);
    --shadow:         0 1px 2px rgba(0,0,0,0.4), 0 8px 28px -14px rgba(0,0,0,0.8);

    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --good-ink: #0ca30c;

    --seq-100: #184f95; --seq-200: #1c5cab; --seq-300: #256abf;
    --seq-400: #2a78d6; --seq-500: #3987e5; --seq-600: #6da7ec; --seq-700: #9ec5f4;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #222220;
  --page:           #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --border-strong:  rgba(255,255,255,0.20);
  --shadow:         0 1px 2px rgba(0,0,0,0.4), 0 8px 28px -14px rgba(0,0,0,0.8);

  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  --good-ink: #0ca30c;

  --seq-100: #184f95; --seq-200: #1c5cab; --seq-300: #256abf;
  --seq-400: #2a78d6; --seq-500: #3987e5; --seq-600: #6da7ec; --seq-700: #9ec5f4;
}

html { scroll-behavior: smooth; scroll-padding-top: 84px; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--ff);
  background: var(--page);
  color: var(--text-primary);
  line-height: 1.55;
  font-size: 16px;
  overflow-x: hidden;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 650; letter-spacing: -0.018em; }
p { margin: 0; }
a { color: inherit; }

/* ---------------- Layout ---------------- */

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }
@media (max-width: 640px) { .wrap { padding: 0 14px; } }

/* ---------------- Top bar ---------------- */

.topbar {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-in {
  max-width: var(--maxw); margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 14px;
}
@media (max-width: 640px) { .topbar-in { padding: 8px 14px; gap: 8px; } }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--series-1), var(--series-7));
  display: grid; place-items: center; color: #fff; font-weight: 750; font-size: 12px;
  letter-spacing: -0.02em;
}
.brand-txt { min-width: 0; }
.brand-title { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
@media (max-width: 760px) { .brand-sub { display: none; } }

.topbar-spacer { flex: 1 1 auto; }

.ctl {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-1); padding: 3px;
}
.ctl button {
  font: inherit; font-size: 12px; font-weight: 600; line-height: 1;
  padding: 6px 11px; border: 0; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--text-secondary);
  transition: background .16s, color .16s;
}
.ctl button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
.ctl button:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--text-primary); }
.ctl button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

/* ---------------- Section nav ---------------- */

.secnav {
  position: sticky; top: 51px; z-index: 55;
  background: color-mix(in srgb, var(--page) 92%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
@media (max-width: 640px) { .secnav { top: 47px; } }
.secnav-in {
  max-width: var(--maxw); margin: 0 auto; padding: 0 20px;
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
}
.secnav-in::-webkit-scrollbar { display: none; }
@media (max-width: 640px) { .secnav-in { padding: 0 14px; } }
.secnav a {
  flex: none; text-decoration: none; font-size: 12.5px; font-weight: 550;
  color: var(--text-muted); padding: 11px 12px; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color .16s, border-color .16s;
}
.secnav a:hover { color: var(--text-primary); }
.secnav a[aria-current="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); }

/* ---------------- Hero ---------------- */

.hero { padding: 56px 0 28px; position: relative; overflow: hidden; }
@media (max-width: 640px) { .hero { padding: 32px 0 20px; } }
.hero::before {
  content: ""; position: absolute; inset: -40% 30% auto -20%; height: 480px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--series-1) 16%, transparent), transparent);
  pointer-events: none; filter: blur(20px);
}
.hero::after {
  content: ""; position: absolute; inset: -30% -20% auto 45%; height: 420px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--series-2) 13%, transparent), transparent);
  pointer-events: none; filter: blur(20px);
}
.hero-in { position: relative; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-secondary);
  border: 1px solid var(--border); background: var(--surface-1);
  padding: 5px 11px; border-radius: 999px; margin-bottom: 18px;
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--critical); }
h1.hero-h {
  font-size: clamp(30px, 6.2vw, 58px); font-weight: 700; letter-spacing: -0.032em;
  max-width: 17ch;
}
.hero-lede {
  margin-top: 16px; max-width: 66ch; font-size: clamp(15px, 1.9vw, 18px);
  color: var(--text-secondary); line-height: 1.6;
}
.hero-meta {
  margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 20px;
  font-size: 12.5px; color: var(--text-muted);
}
.hero-meta b { color: var(--text-secondary); font-weight: 600; }

/* ---------------- Sections ---------------- */

section.sec { padding: 40px 0 8px; scroll-margin-top: 96px; }
@media (max-width: 640px) { section.sec { padding: 28px 0 4px; } }
.sec-head { margin-bottom: 20px; max-width: 78ch; }
.sec-num {
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: var(--series-1);
  text-transform: uppercase; margin-bottom: 8px; display: block;
}
.sec-head h2 { font-size: clamp(21px, 3.4vw, 30px); letter-spacing: -0.026em; }
.sec-head p { margin-top: 10px; color: var(--text-secondary); font-size: 15px; line-height: 1.62; }

/* ---------------- Grid + cards ---------------- */

.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c3  { grid-column: span 3; }
.c4  { grid-column: span 4; }
.c5  { grid-column: span 5; }
.c6  { grid-column: span 6; }
.c7  { grid-column: span 7; }
.c8  { grid-column: span 8; }
.c12 { grid-column: span 12; }
@media (max-width: 1000px) {
  .c3 { grid-column: span 6; } .c4 { grid-column: span 6; } .c5 { grid-column: span 12; }
  .c6 { grid-column: span 12; } .c7 { grid-column: span 12; } .c8 { grid-column: span 12; }
}
@media (max-width: 620px) { .c3, .c4 { grid-column: span 12; } }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  min-width: 0; display: flex; flex-direction: column;
}
@media (max-width: 640px) { .card { padding: 14px; border-radius: 12px; } }

.card-head { margin-bottom: 14px; }
.card-head h3 { font-size: 14.5px; font-weight: 650; letter-spacing: -0.012em; }
.card-head .sub { margin-top: 4px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.card-foot {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
}
.card-foot b { color: var(--text-primary); font-weight: 650; }

/* ---------------- Stat tiles ---------------- */

.stat { justify-content: space-between; gap: 10px; }
.stat .label { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: .01em; }
.stat .value {
  font-size: clamp(26px, 4.4vw, 38px); font-weight: 700; letter-spacing: -0.035em;
  line-height: 1.02; margin-top: 8px;
}
.stat .unit { font-size: 0.5em; font-weight: 600; color: var(--text-secondary); letter-spacing: -0.01em; }
.stat .note { margin-top: 8px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
.stat.is-critical .value { color: var(--critical); }
.stat.is-warning  .value { color: var(--text-primary); }
.stat .spark { margin-top: 12px; }

.tone-bar { height: 3px; border-radius: 3px; margin-bottom: 14px; width: 34px; }

/* ---------------- Chart chrome ---------------- */

.chartbox { position: relative; width: 100%; }
.chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
.chartbox svg text { font-family: var(--ff); }

.ax-label { fill: var(--text-muted); font-size: 11px; }
.ax-title { fill: var(--text-muted); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.baseline { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
.zeroline { stroke: var(--baseline); stroke-width: 1.5; shape-rendering: crispEdges; }
.dlabel { fill: var(--text-primary); font-size: 11px; font-weight: 650; }
.dlabel-sm { fill: var(--text-secondary); font-size: 10.5px; font-weight: 600; }
.annot { fill: var(--text-secondary); font-size: 11px; }
.annot-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); font-weight: 550; }
.legend-item.is-toggle { cursor: pointer; user-select: none; border: 0; background: none; font-family: inherit; padding: 0; }
.legend-item[aria-pressed="false"] { opacity: .38; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.swatch.line { height: 3px; border-radius: 2px; width: 15px; }

/* tooltip */
.tip {
  position: absolute; z-index: 20; pointer-events: none; opacity: 0;
  transform: translate(-50%, -100%) translateY(-10px);
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px;
  font-size: 12px; min-width: 128px; max-width: 260px;
  transition: opacity .12s;
}
.tip.on { opacity: 1; }
.tip-t { font-weight: 700; font-size: 12.5px; margin-bottom: 5px; letter-spacing: -0.01em; }
.tip-r { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; margin-top: 3px; }
.tip-k { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tip-v { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip-n { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 11.5px; line-height: 1.45; }

.hit { fill: transparent; cursor: pointer; }
.hover-band { fill: var(--text-primary); opacity: 0; }
.hover-band.on { opacity: .05; }
.crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.crosshair.on { opacity: 1; }

/* ---------------- Table view ---------------- */

.tbl-toggle {
  margin-top: 12px; font: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--text-secondary); background: none; border: 0; padding: 2px 0;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--border-strong);
}
.tbl-toggle:hover { color: var(--text-primary); }
.tbl-wrap { display: none; margin-top: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl-wrap.on { display: block; }
table.dt { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.dt th, table.dt td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
table.dt th:first-child, table.dt td:first-child { text-align: left; }
table.dt thead th {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
  font-weight: 650; border-bottom: 1px solid var(--border-strong);
  position: sticky; top: 0; background: var(--surface-1);
}
table.dt td { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
table.dt td:first-child { color: var(--text-primary); font-weight: 550; }
table.dt tbody tr:hover td { background: var(--surface-2); }

/* sortable data table */
table.dt th.sortable { cursor: pointer; user-select: none; }
table.dt th.sortable:hover { color: var(--text-primary); }
table.dt th.sortable::after { content: "↕"; margin-left: 5px; opacity: .35; font-size: 10px; }
table.dt th.sortable[data-dir="asc"]::after  { content: "↑"; opacity: 1; }
table.dt th.sortable[data-dir="desc"]::after { content: "↓"; opacity: 1; }

/* ---------------- Insight callout ---------------- */

.insight {
  border-left: 3px solid var(--series-1); background: var(--surface-2);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 13px 15px; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary);
}
.insight b, .insight strong { color: var(--text-primary); font-weight: 650; }
.insight.warn { border-left-color: var(--warning); }
.insight.crit { border-left-color: var(--critical); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border-strong);
  color: var(--text-secondary); white-space: nowrap;
}
.pill .ic { font-size: 10px; line-height: 1; }
.pill.wrap { white-space: normal; text-align: left; line-height: 1.45; padding: 5px 10px; align-items: flex-start; }
.pill.crit { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 42%, transparent); background: color-mix(in srgb, var(--critical) 9%, transparent); }
.pill.warn { color: var(--text-primary); border-color: color-mix(in srgb, var(--warning) 55%, transparent); background: color-mix(in srgb, var(--warning) 15%, transparent); }
.pill.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 42%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.pill.info { color: var(--text-secondary); background: var(--surface-2); }

/* ---------------- Filters ---------------- */

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chip {
  font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-secondary); cursor: pointer; transition: all .15s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.chip:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.filter-label { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-right: 2px; }

.searchbox {
  font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  min-width: 190px; flex: 1 1 190px; max-width: 300px;
}
.searchbox::placeholder { color: var(--text-muted); }
.searchbox:focus { outline: 2px solid var(--series-1); outline-offset: 1px; border-color: transparent; }

/* ---------------- Timeline ---------------- */

.tl { position: relative; padding-left: 22px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--grid); border-radius: 2px; }
.tl-item { position: relative; padding-bottom: 18px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface-1); border: 2.5px solid var(--series-1); box-sizing: border-box;
}
.tl-dot.crit { border-color: var(--critical); }
.tl-dot.warn { border-color: var(--warning); }
.tl-dot.good { border-color: var(--good); }
.tl-date { font-size: 11.5px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tl-title { font-size: 13.5px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
.tl-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.55; }

/* ---------------- Recommendation cards ---------------- */

.rec-list { display: grid; gap: 10px; }
.rec {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 15px; background: var(--surface-1);
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start;
}
.rec-n {
  font-size: 12px; font-weight: 750; color: var(--surface-1); background: var(--text-primary);
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.rec-body h4 { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
.rec-body p { font-size: 12.5px; color: var(--text-secondary); margin-top: 5px; line-height: 1.55; }
.rec-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

/* ---------------- Investment cards / treemap ---------------- */

.tm-cell { cursor: pointer; }

<script>
/* =============================================================
   Mini SVG chart engine — no dependencies.
   Every chart: render(container, spec) -> re-renders on resize.
   ============================================================= */

const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- number / string helpers ---------- */
const NF = (n, d = 0) =>
  n === null || n === undefined || Number.isNaN(n)
    ? '—'
    : n.toLocaleString('en-MY', { minimumFractionDigits: d, maximumFractionDigits: d });

const fmtRM = (n, d = 1, unit = 'bil') =>
  n === null || n === undefined ? '—' : `RM${NF(n, d)} ${unit}`;

const fmtPct = (n, d = 2) => (n === null || n === undefined ? '—' : `${NF(n, d)}%`);

/* short axis ticks: 70,317 -> 70.3k ; 1.5 -> 1.5 */
function tickFmt(v, opts = {}) {
  const a = Math.abs(v);
  if (opts.pct) return `${NF(v, v % 1 === 0 ? 0 : 1)}%`;
  if (opts.compact && a >= 1000) return `${NF(v / 1000, a >= 10000 ? 0 : 1)}k`;
  if (a >= 100) return NF(v, 0);
  if (a >= 10) return NF(v, v % 1 === 0 ? 0 : 1);
  return NF(v, v % 1 === 0 ? 0 : 1);
}

/* ---------- element factory ---------- */
function el(tag, attrs = {}, txt) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) {
    if (attrs[k] === null || attrs[k] === undefined) continue;
    n.setAttribute(k, attrs[k]);
  }
  if (txt !== undefined) n.textContent = txt;
  return n;
}
function h(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}

/* ---------- nice axis ticks ---------- */
function niceTicks(min, max, count = 5) {
  if (min === max) { min = Math.min(0, min); max = max || 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* ---------- tooltip ---------- */
function makeTip(box) {
  let tip = box.querySelector('.tip');
  if (!tip) { tip = h('div', 'tip'); box.appendChild(tip); }
  return {
    show(x, y, html) {
      tip.innerHTML = html;
      tip.classList.add('on');
      const bw = box.clientWidth;
      const tw = tip.offsetWidth;
      const cx = Math.max(tw / 2 + 4, Math.min(bw - tw / 2 - 4, x));
      tip.style.left = cx + 'px';
      tip.style.top = y + 'px';
      const flip = tip.getBoundingClientRect().top < 8;
      tip.style.transform = flip
        ? 'translate(-50%, 0) translateY(14px)'
        : 'translate(-50%, -100%) translateY(-10px)';
    },
    hide() { tip.classList.remove('on'); }
  };
}
function tipRows(rows) {
  return rows.map(r =>
    `<div class="tip-r"><span class="tip-k">${r.c ? `<span class="swatch" style="background:${r.c}"></span>` : ''}${r.k}</span><span class="tip-v">${r.v}</span></div>`
  ).join('');
}

/* ---------- responsive host ---------- */
const _charts = [];
function mount(container, drawFn) {
  const box = typeof container === 'string' ? document.getElementById(container) : container;
  if (!box) return;
  // one record per container — re-mounting replaces rather than duplicates
  const existing = _charts.find(r => r.box === box);
  const rec = existing || { box, w: 0 };
  rec.drawFn = drawFn;
  if (!existing) _charts.push(rec);
  redraw(rec);
}
function redraw(rec) {
  const w = Math.max(220, rec.box.clientWidth);
  rec.w = w;
  const tip = rec.box.querySelector('.tip');
  rec.box.querySelectorAll('svg').forEach(s => s.remove());
  const svg = rec.drawFn(w, rec.box);
  if (svg) rec.box.insertBefore(svg, tip || null);
}
let _rt;
const _ro = new ResizeObserver(() => {
  clearTimeout(_rt);
  _rt = setTimeout(() => _charts.forEach(redraw), 90);
});
function observeCharts() { _charts.forEach(r => { try { _ro.observe(r.box); } catch (e) {} }); }
function redrawAll() { _charts.forEach(redraw); }
function resetCharts() {
  _charts.forEach(r => { try { _ro.unobserve(r.box); } catch (e) {} });
  _charts.length = 0;
}

/* =============================================================
   1. COLUMN CHART  (grouped / stacked / diverging)
   spec: { data:[{label, values:[..], note}], series:[{name,color}],
           mode:'grouped'|'stacked', height, yTitle, fmt, valueLabels }
   ============================================================= */
function columnChart(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const S = spec.series;
    const D = spec.data;
    const narrow = W < 460;
    const H = spec.height || (narrow ? 260 : 300);
    const m = { t: 14, r: narrow ? 8 : 14, b: 34, l: narrow ? 40 : 52 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;

    let lo = 0, hi = 0;
    D.forEach(d => {
      if (spec.mode === 'stacked') {
        let pos = 0, neg = 0;
        d.values.forEach(v => { if (v >= 0) pos += v; else neg += v; });
        hi = Math.max(hi, pos); lo = Math.min(lo, neg);
      } else {
        d.values.forEach(v => { if (v == null) return; hi = Math.max(hi, v); lo = Math.min(lo, v); });
      }
    });
    if (spec.yMin !== undefined) lo = Math.min(lo, spec.yMin);
    if (spec.yMax !== undefined) hi = Math.max(hi, spec.yMax);
    const ticks = niceTicks(lo, hi, narrow ? 4 : 5);
    const yLo = ticks[0], yHi = ticks[ticks.length - 1];
    const y = v => m.t + ih - ((v - yLo) / (yHi - yLo)) * ih;
    const zero = y(0);

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });

    // gridlines
    ticks.forEach(t => {
      svg.appendChild(el('line', { class: t === 0 ? 'zeroline' : 'gridline', x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t) }));
      svg.appendChild(el('text', { class: 'ax-label', x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end' }, tickFmt(t, spec.tick || {})));
    });

    const bandW = iw / D.length;
    const gap = Math.min(18, bandW * 0.26);
    const groupW = bandW - gap;

    D.forEach((d, i) => {
      const bx = m.l + i * bandW + gap / 2;
      // hover band
      const band = el('rect', { class: 'hover-band', x: m.l + i * bandW, y: m.t, width: bandW, height: ih, rx: 6 });
      svg.appendChild(band);

      if (spec.mode === 'stacked') {
        let accP = 0, accN = 0;
        d.values.forEach((v, si) => {
          if (v == null || v === 0) return;
          let y0, y1;
          if (v >= 0) { y0 = y(accP + v); y1 = y(accP); accP += v; }
          else { y0 = y(accN); y1 = y(accN + v); accN += v; }
          const hgt = Math.max(1, Math.abs(y1 - y0) - 2); // 2px surface gap between segments
          svg.appendChild(el('rect', {
            x: bx, y: Math.min(y0, y1), width: groupW, height: hgt,
            rx: 3, fill: S[si].color
          }));
        });
      } else {
        const n = S.length;
        const bw = Math.max(3, (groupW - 2 * (n - 1)) / n); // 2px gap between adjacent bars
        d.values.forEach((v, si) => {
          if (v == null) return;
          const x0 = bx + si * (bw + 2);
          const yv = y(v), hgt = Math.max(1.5, Math.abs(yv - zero));
          const r = Math.min(4, bw / 2);
          const top = v >= 0 ? yv : zero;
          svg.appendChild(el('path', {
            d: v >= 0
              ? `M${x0} ${top + hgt} L${x0} ${top + r} Q${x0} ${top} ${x0 + r} ${top} L${x0 + bw - r} ${top} Q${x0 + bw} ${top} ${x0 + bw} ${top + r} L${x0 + bw} ${top + hgt} Z`
              : `M${x0} ${top} L${x0} ${top + hgt - r} Q${x0} ${top + hgt} ${x0 + r} ${top + hgt} L${x0 + bw - r} ${top + hgt} Q${x0 + bw} ${top + hgt} ${x0 + bw} ${top + hgt - r} L${x0 + bw} ${top} Z`,
            fill: S[si].color
          }));
          if (spec.valueLabels && !narrow) {
            svg.appendChild(el('text', {
              class: 'dlabel-sm', x: x0 + bw / 2, y: v >= 0 ? yv - 6 : yv + 13, 'text-anchor': 'middle'
            }, spec.fmt ? spec.fmt(v) : tickFmt(v, spec.tick || {})));
          }
        });
      }

      // x label
      svg.appendChild(el('text', {
        class: 'ax-label', x: m.l + i * bandW + bandW / 2, y: H - 12, 'text-anchor': 'middle'
      }, d.label));

      const hit = el('rect', { class: 'hit', x: m.l + i * bandW, y: m.t, width: bandW, height: ih });
      hit.addEventListener('pointerenter', ev => {
        band.classList.add('on');
        tip.show(m.l + i * bandW + bandW / 2, m.t + ih * 0.34,
          `<div class="tip-t">${d.tipTitle || d.label}</div>` +
          tipRows(S.map((s, si) => ({
            c: s.color, k: s.name,
            v: d.values[si] == null ? '—' : (spec.fmt ? spec.fmt(d.values[si]) : tickFmt(d.values[si], spec.tick || {}))
          })).filter((_, si) => d.values[si] != null)) +
          (d.note ? `<div class="tip-n">${d.note}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => { band.classList.remove('on'); tip.hide(); });
      svg.appendChild(hit);
    });

    svg.appendChild(el('line', { class: 'baseline', x1: m.l, x2: m.l + iw, y1: y(Math.max(yLo, Math.min(0, yHi))), y2: y(Math.max(yLo, Math.min(0, yHi))) }));
    if (spec.yTitle && !narrow) svg.appendChild(el('text', { class: 'ax-title', x: m.l - 8, y: 10, 'text-anchor': 'end' }, spec.yTitle));
    return svg;
  });
}

/* =============================================================
   2. LINE CHART (multi-series, crosshair)
   spec: { x:[labels], series:[{name,color,values:[],dash}], height, fmt, yTitle,
           annotations:[{xi, text, tone}], area:bool }
   ============================================================= */
function lineChart(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 460;
    const H = spec.height || (narrow ? 250 : 300);
    const m = { t: spec.annotations ? 26 : 14, r: narrow ? 12 : 18, b: 34, l: narrow ? 40 : 52 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const X = spec.x;
    const vis = spec.series.filter(s => s.hidden !== true);

    let lo = Infinity, hi = -Infinity;
    vis.forEach(s => s.values.forEach(v => { if (v == null) return; lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    if (spec.zeroBase) lo = Math.min(lo, 0);
    if (spec.yMin !== undefined) lo = Math.min(lo, spec.yMin);
    if (spec.yMax !== undefined) hi = Math.max(hi, spec.yMax);
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const ticks = niceTicks(lo, hi, narrow ? 4 : 5);
    const yLo = ticks[0], yHi = ticks[ticks.length - 1];
    const px = i => m.l + (X.length === 1 ? iw / 2 : (i / (X.length - 1)) * iw);
    const py = v => m.t + ih - ((v - yLo) / (yHi - yLo)) * ih;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    ticks.forEach(t => {
      svg.appendChild(el('line', { class: t === 0 ? 'zeroline' : 'gridline', x1: m.l, x2: m.l + iw, y1: py(t), y2: py(t) }));
      svg.appendChild(el('text', { class: 'ax-label', x: m.l - 8, y: py(t) + 4, 'text-anchor': 'end' }, tickFmt(t, spec.tick || {})));
    });

    // annotations (vertical markers)
    (spec.annotations || []).forEach(a => {
      const x = px(a.xi);
      svg.appendChild(el('line', { class: 'annot-line', x1: x, x2: x, y1: m.t, y2: m.t + ih }));
      if (!narrow) {
        const t = el('text', { class: 'annot', x: Math.min(x + 6, m.l + iw - 4), y: m.t - 9, 'text-anchor': x > m.l + iw * 0.7 ? 'end' : 'start' }, a.text);
        if (a.tone) t.setAttribute('fill', a.tone);
        svg.appendChild(t);
      }
    });

    // area fills
    if (spec.area) {
      vis.forEach(s => {
        const pts = s.values.map((v, i) => (v == null ? null : [px(i), py(v)])).filter(Boolean);
        if (pts.length < 2) return;
        const d = `M${pts[0][0]} ${py(Math.max(yLo, 0))} L` + pts.map(p => `${p[0]} ${p[1]}`).join(' L') +
          ` L${pts[pts.length - 1][0]} ${py(Math.max(yLo, 0))} Z`;
        svg.appendChild(el('path', { d, fill: s.color, opacity: 0.13 }));
      });
    }

    vis.forEach(s => {
      const pts = s.values.map((v, i) => (v == null ? null : [px(i), py(v)]));
      let d = '', pen = false;
      pts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? ' L' : ' M') + p[0] + ' ' + p[1]; pen = true; });
      svg.appendChild(el('path', { d: d.trim(), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': s.dash || null }));
      pts.forEach(p => {
        if (!p) return;
        svg.appendChild(el('circle', { cx: p[0], cy: p[1], r: 4.5, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 }));
      });
      // direct label at the end
      if (spec.directLabels && !narrow) {
        const last = pts.filter(Boolean).pop();
        const li = pts.lastIndexOf(pts.filter(Boolean).pop());
        if (last && li < X.length - 0.5) {
          svg.appendChild(el('text', { class: 'dlabel', x: last[0] + 8, y: last[1] + 4, fill: s.color }, s.name));
        }
      }
    });

    const cross = el('line', { class: 'crosshair', y1: m.t, y2: m.t + ih });
    svg.appendChild(cross);
    const dots = el('g');
    svg.appendChild(dots);

    X.forEach((lab, i) => {
      const show = narrow ? (i % Math.ceil(X.length / 5) === 0 || i === X.length - 1) : true;
      if (show) svg.appendChild(el('text', { class: 'ax-label', x: px(i), y: H - 12, 'text-anchor': 'middle' }, lab));
    });

    const bw = iw / Math.max(1, X.length - 1);
    X.forEach((lab, i) => {
      const hit = el('rect', { class: 'hit', x: px(i) - bw / 2, y: m.t, width: bw, height: ih });
      hit.addEventListener('pointerenter', () => {
        cross.setAttribute('x1', px(i)); cross.setAttribute('x2', px(i));
        cross.classList.add('on');
        dots.textContent = '';
        vis.forEach(s => {
          if (s.values[i] == null) return;
          dots.appendChild(el('circle', { cx: px(i), cy: py(s.values[i]), r: 6, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 }));
        });
        tip.show(px(i), m.t + ih * 0.3,
          `<div class="tip-t">${spec.xTitle ? spec.xTitle + ' ' : ''}${lab}</div>` +
          tipRows(vis.filter(s => s.values[i] != null).map(s => ({
            c: s.color, k: s.name, v: spec.fmt ? spec.fmt(s.values[i], i, s) : tickFmt(s.values[i], spec.tick || {})
          }))) +
          (spec.notes && spec.notes[i] ? `<div class="tip-n">${spec.notes[i]}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => { cross.classList.remove('on'); dots.textContent = ''; tip.hide(); });
      svg.appendChild(hit);
    });

    svg.appendChild(el('line', { class: 'baseline', x1: m.l, x2: m.l + iw, y1: py(Math.max(yLo, Math.min(0, yHi))), y2: py(Math.max(yLo, Math.min(0, yHi))) }));
    if (spec.yTitle && !narrow) svg.appendChild(el('text', { class: 'ax-title', x: m.l - 8, y: 10, 'text-anchor': 'end' }, spec.yTitle));
    return svg;
  });
}

/* =============================================================
   3. STACKED AREA
   spec: { x, series:[{name,color,values}], height, fmt }
   ============================================================= */
function stackedArea(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 460;
    const H = spec.height || (narrow ? 260 : 310);
    const m = { t: 16, r: narrow ? 12 : 18, b: 34, l: narrow ? 44 : 56 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const X = spec.x, S = spec.series;

    const stacks = X.map((_, i) => {
      let acc = 0;
      return S.map(s => { const v = s.values[i] || 0; const seg = [acc, acc + v]; acc += v; return seg; });
    });
    const hi = Math.max(...stacks.map(st => st[st.length - 1][1]));
    const ticks = niceTicks(0, hi, narrow ? 4 : 5);
    const yHi = ticks[ticks.length - 1];
    const px = i => m.l + (i / (X.length - 1)) * iw;
    const py = v => m.t + ih - (v / yHi) * ih;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    ticks.forEach(t => {
      svg.appendChild(el('line', { class: 'gridline', x1: m.l, x2: m.l + iw, y1: py(t), y2: py(t) }));
      svg.appendChild(el('text', { class: 'ax-label', x: m.l - 8, y: py(t) + 4, 'text-anchor': 'end' }, tickFmt(t, spec.tick || {})));
    });

    // forecast shading
    if (spec.forecastFrom !== undefined) {
      const fx = px(spec.forecastFrom);
      svg.appendChild(el('rect', { x: fx, y: m.t, width: m.l + iw - fx, height: ih, fill: 'var(--text-primary)', opacity: 0.035 }));
      svg.appendChild(el('line', { class: 'annot-line', x1: fx, x2: fx, y1: m.t, y2: m.t + ih }));
      if (!narrow) svg.appendChild(el('text', { class: 'annot', x: fx + 6, y: m.t + 12 }, spec.forecastLabel || 'unjuran'));
    }

    S.forEach((s, si) => {
      const up = X.map((_, i) => `${px(i)} ${py(stacks[i][si][1])}`).join(' L');
      const dn = X.map((_, i) => `${px(X.length - 1 - i)} ${py(stacks[X.length - 1 - i][si][0])}`).join(' L');
      svg.appendChild(el('path', { d: `M${up} L${dn} Z`, fill: s.color, opacity: 0.88 }));
      svg.appendChild(el('path', {
        d: 'M' + X.map((_, i) => `${px(i)} ${py(stacks[i][si][1])}`).join(' L'),
        fill: 'none', stroke: 'var(--surface-1)', 'stroke-width': 2
      }));
    });

    // overlay line (e.g. total cost)
    if (spec.overlay) {
      svg.appendChild(el('path', {
        d: 'M' + X.map((_, i) => `${px(i)} ${py(spec.overlay.values[i])}`).join(' L'),
        fill: 'none', stroke: spec.overlay.color, 'stroke-width': 2, 'stroke-dasharray': '5 4'
      }));
    }

    const cross = el('line', { class: 'crosshair', y1: m.t, y2: m.t + ih });
    svg.appendChild(cross);
    const dots = el('g'); svg.appendChild(dots);

    X.forEach((lab, i) => {
      const show = narrow ? (i % Math.ceil(X.length / 5) === 0 || i === X.length - 1) : (X.length <= 12 || i % 2 === 0);
      if (show) svg.appendChild(el('text', { class: 'ax-label', x: px(i), y: H - 12, 'text-anchor': 'middle' }, lab));
    });

    const bw = iw / Math.max(1, X.length - 1);
    X.forEach((lab, i) => {
      const hit = el('rect', { class: 'hit', x: px(i) - bw / 2, y: m.t, width: bw, height: ih });
      hit.addEventListener('pointerenter', () => {
        cross.setAttribute('x1', px(i)); cross.setAttribute('x2', px(i)); cross.classList.add('on');
        dots.textContent = '';
        S.forEach((s, si) => dots.appendChild(el('circle', { cx: px(i), cy: py(stacks[i][si][1]), r: 5, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2 })));
        const tot = stacks[i][S.length - 1][1];
        tip.show(px(i), m.t + ih * 0.25,
          `<div class="tip-t">${lab}</div>` +
          tipRows(S.map(s => ({ c: s.color, k: s.name, v: spec.fmt ? spec.fmt(s.values[i]) : tickFmt(s.values[i]) })).reverse()) +
          `<div class="tip-r" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span class="tip-k">${spec.totalLabel || 'Jumlah'}</span><span class="tip-v">${spec.fmt ? spec.fmt(tot) : tickFmt(tot)}</span></div>` +
          (spec.notes && spec.notes[i] ? `<div class="tip-n">${spec.notes[i]}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => { cross.classList.remove('on'); dots.textContent = ''; tip.hide(); });
      svg.appendChild(hit);
    });

    svg.appendChild(el('line', { class: 'baseline', x1: m.l, x2: m.l + iw, y1: py(0), y2: py(0) }));
    if (spec.yTitle && !narrow) svg.appendChild(el('text', { class: 'ax-title', x: m.l - 8, y: 10, 'text-anchor': 'end' }, spec.yTitle));
    return svg;
  });
}

/* =============================================================
   4. WATERFALL
   spec: { steps:[{label,value,type:'start'|'delta'|'total',note,color}], height, fmt }
   ============================================================= */
function waterfall(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 560;
    const H = spec.height || (narrow ? 320 : 320);
    // bottom margin carries the value label (14px) then up to 3 wrapped x-label lines
    const m = { t: 22, r: 10, b: narrow ? 78 : 68, l: narrow ? 44 : 58 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const St = spec.steps;

    let acc = 0, lo = 0, hi = 0;
    const geo = St.map(s => {
      if (s.type === 'start' || s.type === 'total') {
        const g = { from: 0, to: s.value };
        acc = s.value; lo = Math.min(lo, 0, s.value); hi = Math.max(hi, 0, s.value); return g;
      }
      const g = { from: acc, to: acc + s.value };
      acc += s.value; lo = Math.min(lo, acc); hi = Math.max(hi, acc); return g;
    });
    const ticks = niceTicks(lo, hi, 5);
    const yLo = ticks[0], yHi = ticks[ticks.length - 1];
    const y = v => m.t + ih - ((v - yLo) / (yHi - yLo)) * ih;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    ticks.forEach(t => {
      svg.appendChild(el('line', { class: t === 0 ? 'zeroline' : 'gridline', x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t) }));
      svg.appendChild(el('text', { class: 'ax-label', x: m.l - 8, y: y(t) + 4, 'text-anchor': 'end' }, tickFmt(t, spec.tick || {})));
    });

    const bandW = iw / St.length;
    const bw = Math.min(narrow ? 34 : 62, bandW * 0.62);

    St.forEach((s, i) => {
      const cx = m.l + i * bandW + bandW / 2;
      const g = geo[i];
      const y0 = y(Math.max(g.from, g.to)), y1 = y(Math.min(g.from, g.to));
      const hgt = Math.max(2, y1 - y0);
      const color = s.color || (s.type === 'start' || s.type === 'total'
        ? 'var(--text-secondary)'
        : (s.value >= 0 ? 'var(--series-3)' : 'var(--critical)'));
      const r = 4;
      svg.appendChild(el('rect', { x: cx - bw / 2, y: y0, width: bw, height: hgt, rx: Math.min(r, hgt / 2), fill: color }));

      // connector
      if (i < St.length - 1 && St[i + 1].type === 'delta') {
        const cy = y(g.to);
        svg.appendChild(el('line', { x1: cx + bw / 2, x2: m.l + (i + 1) * bandW + bandW / 2 - bw / 2, y1: cy, y2: cy, stroke: 'var(--baseline)', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
      }

      // value label
      const vTxt = spec.fmt ? spec.fmt(s.value) : tickFmt(s.value);
      svg.appendChild(el('text', {
        class: 'dlabel', x: cx, y: (g.to >= g.from ? y0 - 7 : y1 + 14), 'text-anchor': 'middle',
        'font-size': narrow ? 10 : 11
      }, (s.type === 'delta' && s.value > 0 ? '+' : '') + vTxt));

      // x label (wrap into up to 3 lines)
      const words = String(s.label).split(' ');
      const maxChars = Math.max(7, Math.floor(bandW / (narrow ? 5.4 : 6.2)));
      const lines = []; let cur = '';
      words.forEach(w => {
        if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
      });
      if (cur) lines.push(cur);
      lines.slice(0, 3).forEach((ln, li) => {
        svg.appendChild(el('text', { class: 'ax-label', x: cx, y: m.t + ih + 32 + li * 11, 'text-anchor': 'middle', 'font-size': narrow ? 9.5 : 10.5 }, ln));
      });

      const hit = el('rect', { class: 'hit', x: m.l + i * bandW, y: m.t, width: bandW, height: ih });
      hit.addEventListener('pointerenter', () => {
        tip.show(cx, m.t + ih * 0.3,
          `<div class="tip-t">${s.label}</div>` +
          tipRows([{ c: color, k: s.type === 'delta' ? (spec.deltaLabel || 'Perubahan') : (spec.levelLabel || 'Kedudukan'), v: (s.type === 'delta' && s.value > 0 ? '+' : '') + vTxt }].concat(
            s.type === 'delta' ? [{ k: spec.runningLabel || 'Baki terkumpul', v: spec.fmt ? spec.fmt(g.to) : tickFmt(g.to) }] : []
          )) +
          (s.note ? `<div class="tip-n">${s.note}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => tip.hide());
      svg.appendChild(hit);
    });

    if (spec.yTitle && !narrow) svg.appendChild(el('text', { class: 'ax-title', x: m.l - 8, y: 10, 'text-anchor': 'end' }, spec.yTitle));
    return svg;
  });
}

/* =============================================================
   5. HORIZONTAL BAR (ranked)
   spec:{ data:[{label,value,color,note,sub}], height?, fmt, max? }
   ============================================================= */
function barChart(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 520;
    const D = spec.data;
    const rowH = spec.rowH || (narrow ? 34 : 30);
    const m = { t: 6, r: narrow ? 8 : 12, b: 6, l: Math.min(narrow ? 168 : 230, W * 0.46) };
    const ih = D.length * rowH;
    const H = ih + m.t + m.b;
    const iw = W - m.l - m.r;
    const max = spec.max || Math.max(...D.map(d => Math.abs(d.value))) || 1;
    const labelSpace = narrow ? 52 : 66;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    D.forEach((d, i) => {
      const y0 = m.t + i * rowH;
      const bh = Math.min(16, rowH - 12);
      const bw = Math.max(2, (Math.abs(d.value) / max) * (iw - labelSpace));
      const color = d.color || 'var(--series-1)';
      svg.appendChild(el('rect', { class: 'hover-band', x: 0, y: y0, width: W, height: rowH - 2, rx: 6 }));
      svg.appendChild(el('path', {
        d: `M${m.l} ${y0 + rowH / 2 - bh / 2} L${m.l + bw - 4} ${y0 + rowH / 2 - bh / 2} Q${m.l + bw} ${y0 + rowH / 2 - bh / 2} ${m.l + bw} ${y0 + rowH / 2 - bh / 2 + 4} L${m.l + bw} ${y0 + rowH / 2 + bh / 2 - 4} Q${m.l + bw} ${y0 + rowH / 2 + bh / 2} ${m.l + bw - 4} ${y0 + rowH / 2 + bh / 2} L${m.l} ${y0 + rowH / 2 + bh / 2} Z`,
        fill: color
      }));
      // label (truncate)
      const maxChars = Math.floor(m.l / (narrow ? 5.6 : 6.3));
      const lab = d.label.length > maxChars ? d.label.slice(0, maxChars - 1) + '…' : d.label;
      const t = el('text', { class: 'dlabel', x: m.l - 10, y: y0 + rowH / 2 + (d.sub && !narrow ? -1 : 4), 'text-anchor': 'end', 'font-size': narrow ? 11 : 11.5 }, lab);
      svg.appendChild(t);
      if (d.sub && !narrow) svg.appendChild(el('text', { class: 'ax-label', x: m.l - 10, y: y0 + rowH / 2 + 11, 'text-anchor': 'end', 'font-size': 9.5 }, d.sub));
      svg.appendChild(el('text', { class: 'dlabel', x: m.l + bw + 8, y: y0 + rowH / 2 + 4, 'font-size': narrow ? 10.5 : 11 }, spec.fmt ? spec.fmt(d.value) : tickFmt(d.value)));

      const hit = el('rect', { class: 'hit', x: 0, y: y0, width: W, height: rowH });
      hit.addEventListener('pointerenter', () => {
        svg.querySelectorAll('.hover-band')[i].classList.add('on');
        tip.show(Math.min(W - 20, m.l + bw / 2), y0 + 4,
          `<div class="tip-t">${d.label}</div>` +
          tipRows([{ c: color, k: spec.valueLabel || 'Nilai', v: spec.fmt ? spec.fmt(d.value) : tickFmt(d.value) }].concat(d.extra || [])) +
          (d.note ? `<div class="tip-n">${d.note}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => { svg.querySelectorAll('.hover-band')[i].classList.remove('on'); tip.hide(); });
      svg.appendChild(hit);
    });
    return svg;
  });
}

/* =============================================================
   6. DUMBBELL / SLOPE  (two values per row — e.g. transfer vs market)
   spec:{ data:[{label, a, b, note}], aName, bName, aColor, bColor, fmt }
   ============================================================= */
function dumbbell(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 520;
    const D = spec.data;
    const rowH = narrow ? 42 : 38;
    const m = { t: 10, r: narrow ? 14 : 20, b: 26, l: Math.min(narrow ? 128 : 240, W * 0.42) };
    const ih = D.length * rowH, H = ih + m.t + m.b, iw = W - m.l - m.r;
    const max = Math.max(...D.flatMap(d => [d.a, d.b])) * 1.06;
    const x = v => m.l + (v / max) * iw;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    niceTicks(0, max, narrow ? 3 : 5).forEach(t => {
      if (t > max) return;
      svg.appendChild(el('line', { class: 'gridline', x1: x(t), x2: x(t), y1: m.t, y2: m.t + ih }));
      svg.appendChild(el('text', { class: 'ax-label', x: x(t), y: H - 8, 'text-anchor': 'middle' }, tickFmt(t, spec.tick || {})));
    });

    D.forEach((d, i) => {
      const cy = m.t + i * rowH + rowH / 2;
      svg.appendChild(el('rect', { class: 'hover-band', x: 0, y: m.t + i * rowH, width: W, height: rowH - 2, rx: 6 }));
      svg.appendChild(el('line', { x1: x(Math.min(d.a, d.b)), x2: x(Math.max(d.a, d.b)), y1: cy, y2: cy, stroke: 'var(--baseline)', 'stroke-width': 3, 'stroke-linecap': 'round' }));
      svg.appendChild(el('circle', { cx: x(d.b), cy, r: 6, fill: spec.bColor || 'var(--series-3)', stroke: 'var(--surface-1)', 'stroke-width': 2 }));
      svg.appendChild(el('circle', { cx: x(d.a), cy, r: 6, fill: spec.aColor || 'var(--series-2)', stroke: 'var(--surface-1)', 'stroke-width': 2 }));
      const maxChars = Math.floor(m.l / (narrow ? 5.6 : 6.3));
      svg.appendChild(el('text', { class: 'dlabel', x: m.l - 10, y: cy + 4, 'text-anchor': 'end', 'font-size': narrow ? 10.5 : 11.5 },
        d.label.length > maxChars ? d.label.slice(0, maxChars - 1) + '…' : d.label));
      const hit = el('rect', { class: 'hit', x: 0, y: m.t + i * rowH, width: W, height: rowH });
      hit.addEventListener('pointerenter', () => {
        svg.querySelectorAll('.hover-band')[i].classList.add('on');
        tip.show(Math.min(W - 20, x(Math.max(d.a, d.b))), m.t + i * rowH,
          `<div class="tip-t">${d.label}</div>` +
          tipRows([
            { c: spec.aColor || 'var(--series-2)', k: spec.aName, v: spec.fmt(d.a) },
            { c: spec.bColor || 'var(--series-3)', k: spec.bName, v: spec.fmt(d.b) },
            { k: spec.gapName || 'Beza', v: spec.fmt(d.a - d.b) }
          ]) + (d.note ? `<div class="tip-n">${d.note}</div>` : ''));
      });
      hit.addEventListener('pointerleave', () => { svg.querySelectorAll('.hover-band')[i].classList.remove('on'); tip.hide(); });
      svg.appendChild(hit);
    });
    return svg;
  });
}

/* =============================================================
   7. TREEMAP (squarified) — magnitude + category colour
   spec:{ data:[{label,value,color,note,cat}], height, fmt }
   ============================================================= */
function treemap(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const H = spec.height || (W < 520 ? 340 : 400);
    const D = spec.data.filter(d => d.value > 0).slice().sort((a, b) => b.value - a.value);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    if (!D.length) return svg;
    const total = D.reduce((s, d) => s + d.value, 0);
    const rects = squarify(D.map(d => (d.value / total) * (W * H)), { x: 0, y: 0, w: W, h: H });

    rects.forEach((r, i) => {
      const d = D[i];
      const g = el('g', { class: 'tm-cell' });
      const pad = 1.5;
      g.appendChild(el('rect', { x: r.x + pad, y: r.y + pad, width: Math.max(0, r.w - pad * 2), height: Math.max(0, r.h - pad * 2), rx: 5, fill: d.color }));
      if (r.w > 62 && r.h > 30) {
        const maxChars = Math.floor((r.w - 16) / 6.1);
        const words = d.label.split(' ');
        const lines = []; let cur = '';
        words.forEach(w => { if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
        if (cur) lines.push(cur);
        const maxLines = Math.max(1, Math.floor((r.h - 26) / 13));
        const ink = { fill: '#fff', stroke: 'rgba(0,0,0,.5)', 'stroke-width': 2.6, 'paint-order': 'stroke', 'stroke-linejoin': 'round' };
        lines.slice(0, maxLines).forEach((ln, li) => {
          g.appendChild(el('text', { ...ink, x: r.x + 9, y: r.y + 19 + li * 13, 'font-size': 11.5, 'font-weight': 650 }, ln));
        });
        if (r.h > 44) g.appendChild(el('text', { ...ink, x: r.x + 9, y: r.y + 22 + Math.min(lines.length, maxLines) * 13, 'font-size': 11, 'font-weight': 600 }, spec.fmt(d.value)));
      }
      g.addEventListener('pointerenter', () => {
        tip.show(r.x + r.w / 2, r.y + 6,
          `<div class="tip-t">${d.label}</div>` +
          tipRows([{ c: d.color, k: spec.valueLabel || 'Kerugian', v: spec.fmt(d.value) }].concat(d.extra || [])) +
          (d.note ? `<div class="tip-n">${d.note}</div>` : ''));
      });
      g.addEventListener('pointerleave', () => tip.hide());
      // bound inside the draw fn so it survives a resize-triggered redraw
      if (spec.onSelect) g.addEventListener('click', () => spec.onSelect(d, i));
      svg.appendChild(g);
    });
    return svg;
  });
}

function squarify(areas, rect) {
  const out = [];
  let items = areas.map((a, i) => ({ a, i }));
  let R = { ...rect };
  const worst = (row, w) => {
    const s = row.reduce((x, r) => x + r.a, 0);
    const mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a));
    return Math.max((w * w * mx) / (s * s), (s * s) / (w * w * mn));
  };
  const layout = (row, w, horizontal) => {
    const s = row.reduce((x, r) => x + r.a, 0);
    const thick = s / w;
    let off = 0;
    row.forEach(r => {
      const len = r.a / thick;
      out[r.i] = horizontal
        ? { x: R.x + off, y: R.y, w: len, h: thick }
        : { x: R.x, y: R.y + off, w: thick, h: len };
      off += len;
    });
    if (horizontal) { R = { x: R.x, y: R.y + thick, w: R.w, h: R.h - thick }; }
    else { R = { x: R.x + thick, y: R.y, w: R.w - thick, h: R.h }; }
  };
  while (items.length) {
    const horizontal = R.w >= R.h;
    const w = horizontal ? R.w : R.h;
    let row = [items.shift()];
    while (items.length && worst(row, w) >= worst(row.concat(items[0]), w)) row.push(items.shift());
    layout(row, w, horizontal);
  }
  return out.map(r => r || { x: 0, y: 0, w: 0, h: 0 });
}

/* =============================================================
   8. GANTT / TENURE TIMELINE
   spec:{ rows:[{label, spans:[{from,to,color,name,note}]}], min, max, height }
   ============================================================= */
function ganttChart(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const narrow = W < 560;
    const rows = spec.rows;
    const rowH = narrow ? 30 : 28;
    const m = { t: 20, r: narrow ? 8 : 14, b: 26, l: Math.min(narrow ? 132 : 230, W * 0.42) };
    const ih = rows.length * rowH, H = ih + m.t + m.b, iw = W - m.l - m.r;
    const x = v => m.l + ((v - spec.min) / (spec.max - spec.min)) * iw;

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    for (let yr = Math.ceil(spec.min); yr <= spec.max; yr++) {
      if (narrow && yr % 2) continue;
      svg.appendChild(el('line', { class: 'gridline', x1: x(yr), x2: x(yr), y1: m.t - 6, y2: m.t + ih }));
      svg.appendChild(el('text', { class: 'ax-label', x: x(yr), y: m.t - 10, 'text-anchor': 'middle', 'font-size': 10 }, `'` + String(yr).slice(2)));
    }
    // scope shading 2014-2020
    if (spec.scope) {
      svg.appendChild(el('rect', { x: x(spec.scope[0]), y: m.t, width: x(spec.scope[1]) - x(spec.scope[0]), height: ih, fill: 'var(--critical)', opacity: 0.055 }));
    }

    rows.forEach((r, i) => {
      const y0 = m.t + i * rowH;
      svg.appendChild(el('rect', { class: 'hover-band', x: 0, y: y0, width: W, height: rowH - 2, rx: 5 }));
      const maxChars = Math.floor(m.l / (narrow ? 5.5 : 6.2));
      svg.appendChild(el('text', { class: 'dlabel', x: m.l - 10, y: y0 + rowH / 2 + 4, 'text-anchor': 'end', 'font-size': narrow ? 10.5 : 11.5 },
        r.label.length > maxChars ? r.label.slice(0, maxChars - 1) + '…' : r.label));
      r.spans.forEach(sp => {
        const x0 = x(Math.max(sp.from, spec.min)), x1 = x(Math.min(sp.to, spec.max));
        const bh = rowH - 13;
        const g = el('g');
        g.appendChild(el('rect', { x: x0, y: y0 + 6.5, width: Math.max(3, x1 - x0), height: bh, rx: 4, fill: sp.color }));
        g.addEventListener('pointerenter', () => {
          svg.querySelectorAll('.hover-band')[i].classList.add('on');
          tip.show((x0 + x1) / 2, y0,
            `<div class="tip-t">${r.label}</div>` +
            tipRows([{ c: sp.color, k: sp.name || (spec.spanLabel || 'Tempoh'), v: sp.range || `${sp.from}–${sp.to}` }]) +
            (sp.note ? `<div class="tip-n">${sp.note}</div>` : ''));
        });
        g.addEventListener('pointerleave', () => { svg.querySelectorAll('.hover-band')[i].classList.remove('on'); tip.hide(); });
        svg.appendChild(g);
      });
    });
    return svg;
  });
}

/* =============================================================
   9. SPARKLINE (tiny, for stat tiles)
   ============================================================= */
function sparkline(box, values, color, opts = {}) {
  mount(box, W => {
    const H = opts.height || 34;
    const lo = Math.min(...values, opts.zero ? 0 : Infinity), hi = Math.max(...values);
    const px = i => (i / (values.length - 1)) * (W - 4) + 2;
    const py = v => H - 3 - ((v - lo) / ((hi - lo) || 1)) * (H - 8);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
    const d = 'M' + values.map((v, i) => `${px(i)} ${py(v)}`).join(' L');
    if (opts.area) svg.appendChild(el('path', { d: d + ` L${px(values.length - 1)} ${H} L${px(0)} ${H} Z`, fill: color, opacity: 0.14 }));
    svg.appendChild(el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    svg.appendChild(el('circle', { cx: px(values.length - 1), cy: py(values[values.length - 1]), r: 3, fill: color }));
    return svg;
  });
}

/* =============================================================
   10. DONUT / PROPORTION BAR
   spec:{ parts:[{name,value,color}], fmt, height }
   ============================================================= */
function propBar(box, spec) {
  mount(box, (W, boxEl) => {
    const tip = makeTip(boxEl);
    const H = spec.height || 46;
    const total = spec.parts.reduce((s, p) => s + p.value, 0);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': spec.aria || '' });
    let x = 0;
    spec.parts.forEach((p, i) => {
      const w = (p.value / total) * W;
      const g = el('g');
      const isFirst = i === 0, isLast = i === spec.parts.length - 1;
      const r = 5;
      const ww = Math.max(0, w - (isLast ? 0 : 2));
      g.appendChild(el('rect', { x, y: 0, width: ww, height: H - 20, rx: (isFirst || isLast) ? r : 2, fill: p.color }));
      if (w > 46) {
        g.appendChild(el('text', {
          x: x + 8, y: 18, fill: '#fff', 'font-size': 12, 'font-weight': 700,
          stroke: 'rgba(0,0,0,.5)', 'stroke-width': 2.6, 'paint-order': 'stroke', 'stroke-linejoin': 'round'
        }, `${Math.round((p.value / total) * 100)}%`));
      }
      g.appendChild(el('text', { class: 'ax-label', x: x + ww / 2, y: H - 5, 'text-anchor': 'middle', 'font-size': 10.5 }, w > 60 ? p.name : ''));
      const xx = x;
      g.addEventListener('pointerenter', () => tip.show(xx + ww / 2, 0,
        `<div class="tip-t">${p.name}</div>` + tipRows([
          { c: p.color, k: spec.valueLabel || 'Nilai', v: spec.fmt(p.value) },
          { k: '% ' + (spec.ofLabel || 'daripada jumlah'), v: `${((p.value / total) * 100).toFixed(1)}%` }
        ]) + (p.note ? `<div class="tip-n">${p.note}</div>` : '')));
      g.addEventListener('pointerleave', () => tip.hide());
      svg.appendChild(g);
      x += w;
    });
    return svg;
  });
}

  { num: 7, cat: 'law', target: T('Parlimen / Kerajaan', 'Parliament / Government'), priority: 'high',
    text: T('Akta 535 perlu dipinda untuk memperjelaskan peruntukan pengiraan agihan keuntungan (hibah) berdasarkan penyata kewangan tahunan yang diaudit mengikut piawaian perakaunan MIA.', 'Akta 535 should be amended to clarify the provisions for calculating profit distribution (hibah) based on annual financial statements audited to MIA accounting standards.') },
  { num: 8, cat: 'law', target: T('Parlimen / Kerajaan / LTH', 'Parliament / Government / Tabung Haji'), priority: 'high',
    text: T('Akta 535 perlu dipinda untuk menubuhkan sebuah jabatan bernama Dana Haji yang bertanggungjawab ke atas pelaburan LTH dan dikawal selia oleh Suruhanjaya Sekuriti Malaysia.', 'Akta 535 should be amended to establish a department called Dana Haji, responsible for LTH\'s investments and regulated by the Securities Commission Malaysia.') },
  { num: 9, cat: 'law', target: T('Parlimen / Kerajaan', 'Parliament / Government'), priority: 'medium',
    text: T('Seksyen 26 Akta 535 perlu dipinda untuk mengecualikan LTH daripada pemakaian Akta Badan Berkanun (Akuan dan Laporan Tahunan) 1980 (Akta 240).', 'Section 26 of Akta 535 should be amended to exempt LTH from the Statutory Bodies (Accounts and Annual Reports) Act 1980 (Akta 240).') },
  { num: 10, cat: 'governance', target: T('Kerajaan', 'Government'), priority: 'high',
    text: T('Struktur tadbir urus LTH perlu disusun semula supaya Menteri Hal Ehwal Agama diberi mandat bagi pengurusan haji dan Menteri Kewangan bagi pengurusan kewangan, dana dan pelaburan, manakala pelantikan anggota Lembaga dan Ketua Pegawai Eksekutif dibuat oleh Perdana Menteri atas syor badan penasihat bebas.', 'LTH\'s governance structure should be restructured so the Minister for Religious Affairs is mandated over hajj management and the Finance Minister over finance, funds and investment, while Board members and the Chief Executive Officer are appointed by the Prime Minister on the recommendation of an independent advisory body.') },
  { num: 11, cat: 'governance', target: T('LTH', 'Tabung Haji'), priority: 'medium',
    text: T('Penglibatan anggota Lembaga dan pengurusan LTH dalam pengurusan anak-anak syarikat LTH hendaklah dihadkan bagi mengelak konflik kepentingan.', 'Involvement of LTH Board members and management in managing LTH\'s subsidiaries should be limited to avoid conflicts of interest.') },
  { num: 12, cat: 'oversight', target: T('BNM / Kerajaan', 'Bank Negara Malaysia / Government'), priority: 'high',
    text: T('BNM tidak seharusnya mengawal selia LTH, dan jika pengawalseliaan masih diperlukan, ia hendaklah dihadkan kepada kawalan rizab dan pengurusan kecairan sahaja tanpa tertakluk kepada Akta 759, Akta 758 dan Akta 618.', 'BNM should not regulate LTH; if oversight is still needed, it should be limited to reserve control and liquidity management only, without LTH being subject to Akta 759, Akta 758 and Akta 618.') },
  { num: 13, cat: 'finance', target: T('LTH / Kerajaan', 'Tabung Haji / Government'), priority: 'medium',
    text: T('Pengauditan penyata kewangan LTH tidak lagi perlu dipertanggungjawabkan kepada JAN, sebaliknya LTH dibenarkan melantik firma akauntan swasta untuk mengaudit penyata kewangannya.', 'Auditing of LTH\'s financial statements should no longer be the responsibility of the National Audit Department (JAN); LTH should instead be allowed to appoint a private accounting firm to audit its financial statements.') },
  { num: 14, cat: 'finance', target: T('LTH', 'Tabung Haji'), priority: 'high',
    text: T('Kadar pengagihan keuntungan (hibah) perlu berdasarkan penyata kewangan tahunan yang diaudit dan bukan Laporan Proforma, dan nilai aset serta liabiliti dalam RAV tidak boleh dijadikan asas pembayaran hibah.', 'The profit distribution (hibah) rate should be based on audited annual financial statements, not the Proforma Report, and asset and liability values in the RAV must not be used as the basis for hibah payments.') },
  { num: 15, cat: 'finance', target: T('LTH', 'Tabung Haji'), priority: 'medium',
    text: T('Penyata kewangan LTH hendaklah mematuhi sepenuhnya piawaian dan prinsip pelaporan Akta 240 serta PA 3.1 Garis Panduan Penyediaan dan Pembentangan Laporan Tahunan dan Penyata Kewangan Badan Berkanun Persekutuan.', 'LTH\'s financial statements must fully comply with the reporting standards and principles of Akta 240 and PA 3.1, the Guidelines on the Preparation and Presentation of Annual Reports and Financial Statements of Federal Statutory Bodies.') },
  { num: 16, cat: 'governance', target: T('LTH', 'Tabung Haji'), priority: 'high',
    text: T('Amalan pemberian bonus yang terlalu tinggi kepada kakitangan hendaklah dihentikan.', 'The practice of awarding excessively high bonuses to staff should be stopped.') },
  { num: 17, cat: 'governance', target: T('LTH', 'Tabung Haji'), priority: 'high',
    text: T('Usaha perlu dibuat untuk mendapatkan semula bonus yang telah diberikan kepada ahli Lembaga dan Pengurusan TH Properties kerana bonus itu diberikan tanpa mematuhi peraturan yang ditetapkan.', 'Efforts should be made to recover the bonuses paid to Board members and TH Properties management, as these were given without complying with the rules set.') },
  { num: 18, cat: 'finance', target: T('LTH / Kerajaan', 'Tabung Haji / Government'), priority: 'high',
    text: T('Audit forensik perlu dilaksanakan untuk meneliti bagaimana keputusan pelaburan lalu dibuat sehingga menyebabkan penurunan nilai aset yang teruk, melibatkan pelaburan seperti THIP, Emrail, Wellspring Worldwide, DSSB, Trurich, Abraj, Putrajaya Perdana, Al-Rawda, Al-Fareeda, THP, TH Properties, Alam Maritim/TH Marine, THHR dan FGV.', 'A forensic audit should be carried out to examine how past investment decisions led to severe asset impairment, covering investments such as THIP, Emrail, Wellspring Worldwide, DSSB, Trurich, Abraj, Putrajaya Perdana, Al-Rawda, Al-Fareeda, THP, TH Properties, Alam Maritim/TH Marine, THHR and FGV.') },
  { num: 19, cat: 'governance', target: T('Pihak Berkuasa / Kerajaan', 'Authorities / Government'), priority: 'high',

  { num: 20, cat: 'governance', target: T('LTH', 'Tabung Haji'), priority: 'medium',
    text: T('Proses penyempurnaan tindakan tatatertib di LTH, termasuk durasi penahanan kerja, perlu diperkemas dan disegerakan agar dilihat sebagai proses yang berkesan, cekap, adil dan telus.', 'The disciplinary process at LTH, including the duration of work suspensions, should be streamlined and expedited so it is seen as effective, efficient, fair and transparent.') },

    text: T('Transaksi pelaburan yang masih bertikai di mahkamah atau prosiding timbang tara perlu dipantau rapi oleh Pengurusan dan Lembaga; penyelesaian di luar mahkamah/timbang tara harus dipertingkatkan.', 'Investment transactions still under litigation or arbitration should be closely monitored by Management and the Board, and out-of-court/arbitration settlements should be pursued more actively.') },
  { num: 22, cat: 'finance', target: T('LTH', 'Tabung Haji'), priority: 'medium',
    text: T('LTH perlu memastikan bayaran zakat dilaksanakan dengan sempurna; isu perubahan akad simpanan perlu dikemukakan kepada Jawatankuasa Muzakarah MKI untuk keputusan hukum.', 'LTH must ensure zakat payments are carried out properly, and any issue over changing the savings akad (contract) should be referred to the MKI Muzakarah Committee for a religious ruling.') },
  { num: 23, cat: 'finance', target: T('Kerajaan', 'Government'), priority: 'high',
    text: T('Kerajaan perlu memberi perhatian serius terhadap pelaksanaan Pelan Pemulihan dan Penstrukturan LTH 2018 bagi memastikan matlamatnya tercapai, memandangkan kegagalan LTH akan mengaktifkan jaminan Kerajaan bernilai RM88 bilion di bawah seksyen 24 Akta 535.', 'The Government must pay serious attention to implementing the 2018 LTH Recovery and Restructuring Plan to ensure its goals are met, since LTH\'s failure would trigger the Government\'s RM88 billion guarantee under section 24 of Akta 535.') },
  { num: 24, cat: 'finance', target: T('Kerajaan / UJSB', 'Government / UJSB'), priority: 'medium',
    text: T('Penstrukturan semula Sukuk yang dicadangkan perlu mempunyai ciri boleh diniagakan (tradeable) untuk memberi fleksibiliti kepada LTH mengurus aset dan mengoptimumkan pendapatan.', 'The proposed Sukuk restructuring should be made tradeable to give LTH flexibility in managing assets and optimising income.') },
  { num: 25, cat: 'finance', target: T('Kerajaan / UJSB', 'Government / UJSB'), priority: 'medium',
    text: T('Penerbitan Sukuk tidak hanya ditawarkan kepada LTH atau Kerajaan tetapi juga kepada institusi-institusi kewangan lain.', 'Sukuk issuance should be offered not only to LTH or the Government but also to other financial institutions.') },
  { num: 26, cat: 'finance', target: T('Kerajaan', 'Government'), priority: 'high',
    text: T('Kerajaan hendaklah memastikan peruntukan sebanyak RM1.73 bilion setahun dibuat, seperti dipersetujui Jemaah Menteri, bagi tujuan penebusan awal Sukuk-sukuk UJSB.', 'The Government must ensure the RM1.73 billion annual allocation agreed by the Cabinet is made for the early redemption of UJSB Sukuk.') },
  { num: 27, cat: 'finance', target: T('UJSB', 'UJSB'), priority: 'medium',
    text: T('UJSB digalakkan membuat penebusan awal Sukuk hasil daripada pelupusan aset-aset yang telah dipindahkan dari LTH kepada UJSB.', 'UJSB should be encouraged to redeem its Sukuk early using proceeds from disposing of assets transferred from LTH to UJSB.') },
  { num: 28, cat: 'hajj', target: T('LTH', 'Tabung Haji'), priority: 'high',

  { num: 30, cat: 'hajj', target: T('LTH', 'Tabung Haji'), priority: 'high',

  { num: 31, cat: 'hajj', target: T('LTH', 'Tabung Haji'), priority: 'medium',
    text: T('LTH perlu merancang agar mampu membawa lebih ramai jemaah haji pada masa hadapan dan menggunakan sepenuhnya kuota tambahan yang ditawarkan Kerajaan Arab Saudi.', 'LTH should plan to be able to send more pilgrims in future and make full use of the additional quota offered by the Saudi Arabian Government.') },
  { num: 32, cat: 'hajj', target: T('LTH', 'Tabung Haji'), priority: 'high',
    text: T('LTH perlu menaikkan minimum bayaran pendaftaran haji Muassasah daripada RM1,300 kepada bayaran semasa RM12,980, sekaligus mengurangkan tempoh menunggu giliran haji daripada 130 tahun kepada 33 tahun.', 'LTH should raise the minimum Muassasah hajj registration payment from RM1,300 to the current rate of RM12,980, which would also cut the hajj waiting period from 130 years to about 33 years.') },
  { num: 33, cat: 'invest', target: T('LTH / Suruhanjaya Sekuriti', 'Tabung Haji / Securities Commission'), priority: 'high',

/* =============================================================

let LANG = (localStorage.getItem('rci-lang') === 'en') ? 'en' : 'ms';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const rm = (v, d = 1) => v === null || v === undefined ? '—' : `RM${NF(v, d)}`;
const rmBil = (v, d = 2) => v === null || v === undefined ? '—' : `RM${NF(v, d)} ${LANG === 'ms' ? 'bil' : 'bn'}`;

const SECTIONS = [
  ['overview', 'navOverview'], ['crisis', 'navCrisis'], ['hibah', 'navHibah'],

];

/* ---------- helpers ---------- */
function setHTML(id, html) { const n = document.getElementById(id); if (n) n.innerHTML = html; }
function legend(id, items, style) {

    `<span class="legend-item"><span class="swatch${style === 'line' ? ' line' : ''}" style="background:${i.color}"></span>${esc(i.name)}</span>`
  ).join(''));
}
function dataTable(id, cols, rows) {
  setHTML(id, `<table class="dt"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === null || c === undefined ? '—' : c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);

const priPill = p => `<span class="pill ${p === 'high' ? 'crit' : p === 'medium' ? 'warn' : 'info'}"><span class="ic">${p === 'high' ? '▲' : p === 'medium' ? '●' : '○'}</span>${U('l_' + p)}</span>`;

/* ---------- 1. THE GAP ---------- */
function buildGap() {
  const S = [
    { name: U('l_before'), color: C(1) },
    { name: U('l_hibah'), color: C(2) },
    { name: U('l_after'), color: 'var(--critical)' }
  ];
  legend('gapLegend', S);
  columnChart('gapChart', {
    mode: 'grouped', series: S, height: 320,
    tick: { compact: true }, fmt: v => rmMil(v),
    aria: U('c_gap_t'),
    data: DATA.balanceSheet.map(d => ({
      label: String(d.year), values: [d.before, d.hibah, d.after],
      note: t(DATA.balanceSheetNotes[d.year])
    }))
  });
  dataTable('gapTbl',
    [U('year'), U('l_assets'), U('l_liab'), U('l_before'), U('l_hibah'), U('l_after')],
    DATA.balanceSheet.map(d => [d.year, NF(d.assets), NF(d.liabilities), NF(d.before), NF(d.hibah), NF(d.after)]));

  const AL = [
    { name: U('l_assets'), color: C(1), values: DATA.balanceSheet.map(d => d.assets) },
    { name: U('l_liab'), color: C(8), values: DATA.balanceSheet.map(d => -d.liabilities) }
  ];
  legend('alLegend', AL, 'line');
  lineChart('alChart', {
    x: DATA.balanceSheet.map(d => String(d.year)), series: AL, height: 250,
    tick: { compact: true }, fmt: v => rmMil(v), aria: U('c_al_t'),
    annotations: [{ xi: 2, text: LANG === 'ms' ? 'liabiliti > aset' : 'liabilities > assets', tone: 'var(--critical)' }]
  });
  setHTML('alFoot', LANG === 'ms'
    ? 'Menjelang 2016 liabiliti LTH melebihi asetnya sebanyak <b>RM1.26 bilion</b>. Seksyen 22 Akta 535 melarang agihan keuntungan dalam keadaan ini — melainkan aset dinilai semula.'
    : 'By 2016 LTH\'s liabilities exceeded its assets by <b>RM1.26 billion</b>. Section 22 of Act 535 bars a profit distribution in that state — unless the assets are revalued.');

  const totalHibah = DATA.balanceSheet.reduce((s, d) => s - d.hibah, 0) / 1000;
  const totalBefore = DATA.balanceSheet.reduce((s, d) => s + d.before, 0) / 1000;
  setHTML('gapInsight', LANG === 'ms'
    ? `Sepanjang 2014–2017 LTH menjana lebihan terkumpul <b>RM${NF(totalBefore, 2)} bilion</b> sebelum agihan — tetapi mengagihkan <b>RM${NF(totalHibah, 2)} bilion</b> sebagai hibah. Beza <b>RM${NF(totalHibah - totalBefore, 2)} bilion</b> itu datang daripada suatu tempat: rizab pendeposit sendiri.`
    : `Across 2014–2017 LTH generated a cumulative surplus of <b>RM${NF(totalBefore, 2)} billion</b> before distribution — and paid out <b>RM${NF(totalHibah, 2)} billion</b> in hibah. That <b>RM${NF(totalHibah - totalBefore, 2)} billion</b> difference had to come from somewhere: the depositors' own reserves.`);
}

/* ---------- 2. HIBAH ---------- */

  lineChart('depChart', {
    x: DATA.deposits.map(d => t(d.label)),

    : 'The <b>1.25%</b> hibah announcement triggered a RM4 billion contraction. The Commission called it fortunate — the actual impact was far smaller than feared.');
}

/* ---------- 5. INVESTMENTS ---------- */
function filteredInv() {
  const q = ST.invQuery.trim().toLowerCase();
  return DATA.investments.filter(i =>
    (ST.invSector === 'all' || i.sector === ST.invSector) &&
    (!q || i.name.toLowerCase().includes(q) || t(i.what).toLowerCase().includes(q)));
}

function buildInvFilters() {
  const cats = [['all', U('all')]].concat(Object.entries(DATA.sectors).map(([k, v]) => [k, t(v.label)]));
  setHTML('invFilters',
    `<span class="filter-label">${U('l_sector')}</span>` +
    cats.map(([k, l]) => `<button class="chip" data-sector="${k}" aria-pressed="${ST.invSector === k}">${esc(l)}</button>`).join('') +
    `<input class="searchbox" id="invSearch" type="search" placeholder="${U('search')}" value="${esc(ST.invQuery)}">`);
  document.querySelectorAll('#invFilters .chip').forEach(b =>
    b.addEventListener('click', () => { ST.invSector = b.dataset.sector; ST.invSelected = 0; renderInv(); }));
  const s = document.getElementById('invSearch');
  s.addEventListener('input', () => { ST.invQuery = s.value; ST.invSelected = 0; renderInv(true); });
}

function renderInv(keepFocus) {
  const list = filteredInv();
  document.querySelectorAll('#invFilters .chip').forEach(b => b.setAttribute('aria-pressed', String(ST.invSector === b.dataset.sector)));

  legend('invLegend', Object.entries(DATA.sectors)
    .filter(([k]) => ST.invSector === 'all' || ST.invSector === k)
    .map(([k, v]) => ({ name: t(v.label), color: v.color })));

  const withLoss = list.filter(i => i.loss);
  resetChartsIn('tmChart');
  treemap('tmChart', {
    data: withLoss.map(i => ({
      label: i.name, value: i.loss, color: DATA.sectors[i.sector].color,
      note: t(i.status), ref: i,
      extra: [{ k: U('l_sector'), v: t(DATA.sectors[i.sector].label) }].concat(
        i.invested ? [{ k: U('l_invested'), v: rmMil(i.invested, 1) }] : [])
    })),
    height: 400, fmt: v => rmMil(v, 1), valueLabel: U('l_loss'), aria: U('c_tm_t'),
    onSelect: d => { ST.invSelected = DATA.investments.indexOf(d.ref); renderInvDetail(); }
  });
  observeCharts();

  renderInvDetail();
  renderInvTable();
  if (keepFocus) { const s = document.getElementById('invSearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}

function renderInvDetail() {
  const list = filteredInv();
  const i = DATA.investments[ST.invSelected] && list.includes(DATA.investments[ST.invSelected])
    ? DATA.investments[ST.invSelected]

    return;
  }
  const sec = DATA.sectors[i.sector];
  setHTML('invDetail',
    `<div class="card-head">
       <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px">
         <span class="pill" style="border-color:${sec.color};color:var(--text-primary)"><span class="swatch" style="background:${sec.color}"></span>${t(sec.label)}</span>
         <span class="pill info">${t(i.type)}</span>
         ${i.year ? `<span class="pill info">${i.year}</span>` : ''}
         <span class="pill ${i.severity === 'high' ? 'crit' : 'warn'}"><span class="ic">${i.severity === 'high' ? '▲' : '●'}</span>${i.severity === 'high' ? U('l_high') : U('l_medium')}</span>
       </div>
       <h3 style="font-size:16px">${esc(i.name)}</h3>
     </div>
     <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px">
       <div><div style="font-size:11.5px;color:var(--text-muted);font-weight:600">${U('l_loss')}</div>
         <div class="mono" style="font-size:22px;font-weight:750;color:var(--critical);letter-spacing:-.03em">${i.loss ? rmMil(i.loss, 1) : U('l_noAmount')}</div></div>
       ${i.invested ? `<div><div style="font-size:11.5px;color:var(--text-muted);font-weight:600">${U('l_invested')}</div>
         <div class="mono" style="font-size:22px;font-weight:750;letter-spacing:-.03em">${rmMil(i.invested, 1)}</div></div>` : ''}
     </div>
     <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${t(i.what)}</p>
     <div style="margin-top:13px">
       <div style="font-size:11.5px;color:var(--text-muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px">${U('l_redflags')}</div>
       <div style="display:flex;flex-wrap:wrap;gap:5px">${i.flags.map(f => `<span class="pill crit">${esc(t(f))}</span>`).join('')}</div>
     </div>
     <div class="card-foot"><b>${U('l_status')}:</b> ${esc(t(i.status))}${i.noAmount ? ` <span class="dim">${esc(t(i.noAmount))}</span>` : ''}</div>`);
