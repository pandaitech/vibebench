<!doctype html>

<title>RCI Tabung Haji — Dashboard Penerokaan Data</title>

<meta name="theme-color" content="#0e7a4d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕋</text></svg>">

      <button class="burger" id="burger" aria-label="Buka menu">☰</button>

        <b id="tb-tajuk">RCI Tabung Haji</b>

      <div class="tb-aksi">
        <button class="btn ghost sm" id="btnTema" title="Tukar tema">🌓</button>
        <a class="btn ghost sm" href="https://github.com/SyahmiRafsan/rci-tabunghaji/blob/main/rci-tabung-haji.md" target="_blank" rel="noopener" title="Buka laporan asal">📄 Laporan</a>

  <nav class="tabbar" id="tabbar" aria-label="Navigasi bawah"></nav>
