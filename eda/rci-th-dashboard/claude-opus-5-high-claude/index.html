<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meneroka Laporan RCI Tabung Haji — Dashboard Analisis Data</title>
<meta name="description" content="Dashboard penerokaan data bagi Laporan Suruhanjaya Siasatan Diraja Tabung Haji (2014–2020). Setiap angka boleh dijejak kembali ke muka surat laporan asal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕋</text></svg>">
<style>
/* ================= ASAS ================= */
:root{
  --bg:#0b0f14; --bg2:#111823; --panel:#141c28; --panel2:#1a2331; --line:#243044;
  --ink:#e8eef7; --ink2:#a5b4c8; --ink3:#6f8098;
  --pri:#2dd4bf; --fakta:#60a5fa; --terbit:#fbbf24; --unjur:#c084fc; --simul:#f472b6;
  --neg:#f87171; --pos:#4ade80; --warn:#fb923c;
  --r:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --rail:250px;
}
html[data-tema="cerah"]{
  --bg:#f5f7fa; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f3f8; --line:#dde4ee;
  --ink:#101826; --ink2:#465468; --ink3:#77869c;
  --pri:#0d9488; --fakta:#2563eb; --terbit:#b45309; --unjur:#7c3aed; --simul:#be185d;
  --neg:#dc2626; --pos:#15803d; --warn:#c2410c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:var(--pri)}
h1,h2,h3,h4{margin:0; line-height:1.25; font-weight:650; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
::selection{background:var(--pri); color:#04140f}

/* ================= SUSUN ATUR ================= */
.wrap{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100vh}
.rail{
  position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--bg2);
  border-right:1px solid var(--line); padding:18px 0 40px; z-index:30;
}
.brand{padding:0 18px 16px; border-bottom:1px solid var(--line); margin-bottom:12px}
.brand b{display:block; font-size:15px; letter-spacing:-.02em}
.brand small{display:block; color:var(--ink3); font-size:11.5px; line-height:1.45; margin-top:5px}
.nav{display:flex; flex-direction:column; gap:1px; padding:0 8px}
.nav button{
  display:flex; gap:10px; align-items:flex-start; text-align:left; background:none; border:0;
  padding:9px 10px; border-radius:8px; color:var(--ink2); font-size:13.5px; line-height:1.35;
}
.nav button:hover{background:var(--panel2); color:var(--ink)}
.nav button.on{background:var(--panel2); color:var(--ink); box-shadow:inset 2px 0 0 var(--pri)}
.nav .num{font:600 10.5px/1.6 var(--mono); color:var(--ink3); min-width:16px; padding-top:1px}
.nav button.on .num{color:var(--pri)}
.nav .sep{padding:16px 12px 6px; font:600 10px/1 var(--mono); letter-spacing:.12em; color:var(--ink3); text-transform:uppercase}

.scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:25; display:none}
.main{min-width:0; padding:0 clamp(14px,3vw,34px) 90px}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  margin:0 calc(-1*clamp(14px,3vw,34px)) 22px; padding:10px clamp(14px,3vw,34px);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.topbar .grow{flex:1; min-width:0}
.mburger{display:none}

/* ================= KOMPONEN ================= */
.pane{max-width:1180px}
.pane-h{margin:6px 0 20px}
.pane-h .kicker{font:600 10.5px/1 var(--mono); letter-spacing:.14em; color:var(--pri); text-transform:uppercase}
.pane-h h2{font-size:clamp(21px,3.4vw,29px); margin:9px 0 8px}
.pane-h p{margin:0; color:var(--ink2); max-width:76ch; font-size:15px}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 17px; margin-bottom:16px}
.card > h3{font-size:16.5px; margin-bottom:4px}
.card .sub{color:var(--ink2); font-size:13.5px; margin:2px 0 14px; max-width:80ch}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}

/* Label asal-usul data */
.pv{display:inline-flex; align-items:center; gap:4px; font:600 9.5px/1 var(--mono); letter-spacing:.07em;
  padding:4px 6px; border-radius:5px; text-transform:uppercase; white-space:nowrap; vertical-align:middle}
.pv-f{background:color-mix(in srgb,var(--fakta) 17%,transparent); color:var(--fakta); border:1px solid color-mix(in srgb,var(--fakta) 34%,transparent)}
.pv-t{background:color-mix(in srgb,var(--terbit) 17%,transparent); color:var(--terbit); border:1px solid color-mix(in srgb,var(--terbit) 34%,transparent)}
.pv-u{background:color-mix(in srgb,var(--unjur) 17%,transparent); color:var(--unjur); border:1px solid color-mix(in srgb,var(--unjur) 34%,transparent)}
.pv-s{background:color-mix(in srgb,var(--simul) 17%,transparent); color:var(--simul); border:1px solid color-mix(in srgb,var(--simul) 34%,transparent)}

/* Petak angka */
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px; position:relative;
  cursor:pointer; text-align:left; width:100%; transition:border-color .14s, transform .14s}
.kpi:hover{border-color:var(--pri); transform:translateY(-1px)}
.kpi .v{font:650 clamp(21px,3vw,27px)/1.1 var(--sans); letter-spacing:-.02em; margin:8px 0 5px; display:block}
.kpi .l{font-size:12.5px; color:var(--ink2); line-height:1.4; display:block}
.kpi .go{font:600 10.5px/1 var(--mono); color:var(--ink3); margin-top:9px; display:block}
.kpi:hover .go{color:var(--pri)}

/* Kotak "cara baca" */
.baca{border-top:1px dashed var(--line); margin-top:14px; padding-top:12px; display:grid; gap:9px}
.baca .row{display:grid; grid-template-columns:104px 1fr; gap:11px; font-size:13.2px; align-items:start}
.baca .row > b{font:600 10px/1.7 var(--mono); letter-spacing:.05em; color:var(--ink3); text-transform:uppercase}
.baca .row.no > b{color:var(--warn)}
.baca .row span{color:var(--ink2)}
.baca .row span b{color:var(--ink); font-weight:650}

/* Kawalan */
.ctl{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:13px}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:2px; gap:2px; flex-wrap:wrap}
.seg button{background:none; border:0; padding:6px 11px; border-radius:6px; font-size:12.5px; color:var(--ink2); white-space:nowrap}
.seg button.on{background:var(--pri); color:#04140f; font-weight:600}
.seg button:hover:not(.on){color:var(--ink)}
.chip{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--ink2)}
.chip.on{background:var(--pri); color:#04140f; border-color:var(--pri); font-weight:600}
input[type=search],input[type=text],select{
  background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px;
  padding:7px 11px; font:inherit; font-size:13.5px; min-width:0; max-width:100%;
}
input[type=range]{accent-color:var(--pri); width:100%}
label.fld{display:block; font-size:12.5px; color:var(--ink2); margin-bottom:5px}
label.fld b{color:var(--ink); font-weight:600}

/* Carta */
.chart{width:100%; min-height:40px}
.chart svg{display:block; overflow:visible}
svg .grid{display:initial; stroke:var(--line); stroke-width:1}
svg .grid-zero{stroke:var(--ink3); stroke-width:1.4}
text.axis{font:500 11px var(--mono); fill:var(--ink3)}
text.axis-label{font:600 10px var(--mono); fill:var(--ink3); letter-spacing:.06em; text-transform:uppercase}
text.val{font:600 11px var(--mono)}
.bar{transition:opacity .12s}
.bar:hover{opacity:.78}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:11px; font-size:12.5px; color:var(--ink2)}
.legend .lg{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; flex:none}

/* Tooltip */
.tip{position:fixed; top:0; left:0; z-index:200; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:12.7px;
  max-width:295px; box-shadow:0 12px 34px rgba(0,0,0,.5); line-height:1.5}
.tip.on{opacity:1}
.tip b{display:block; margin-bottom:4px; font-size:13px}
.tip .kv{display:flex; justify-content:space-between; gap:14px; color:var(--ink2)}
.tip .kv span:last-child{font-family:var(--mono); color:var(--ink)}
.tip .note{margin-top:6px; padding-top:6px; border-top:1px solid var(--line); color:var(--ink3); font-size:11.5px}

/* Jadual */
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; margin-top:6px}
table{border-collapse:collapse; width:100%; font-size:13.2px; min-width:520px}
th,td{padding:8px 11px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{background:var(--panel2); font:600 11px/1.4 var(--mono); letter-spacing:.04em; color:var(--ink2);
  text-transform:uppercase; position:sticky; top:0; white-space:nowrap; cursor:pointer; user-select:none}
th.num,td.num{text-align:right; font-family:var(--mono); white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tr.tot{font-weight:650} tr.tot td{border-top:2px solid var(--line); background:var(--panel2)}
td.neg,.neg-t{color:var(--neg)} td.pos,.pos-t{color:var(--pos)}

/* Rujukan sumber */
.src{display:inline-flex; align-items:center; gap:5px; font:600 10.5px/1 var(--mono); color:var(--ink3);
  background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:4px 7px; text-decoration:none}
.src:hover{color:var(--pri); border-color:var(--pri)}
.srcbar{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:13px; padding-top:11px; border-top:1px solid var(--line)}

/* Istilah */
.ist{border-bottom:1px dotted var(--pri); cursor:help; color:inherit}

/* Nota */
.note{border-left:3px solid var(--pri); background:var(--panel2); padding:11px 13px; border-radius:0 9px 9px 0;
  font-size:13.4px; color:var(--ink2); margin:13px 0}
.note.w{border-left-color:var(--warn)} .note.d{border-left-color:var(--neg)}
.note b{color:var(--ink)}

/* Garis masa */
.tl{position:relative; padding-left:22px}
.tl::before{content:''; position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--line)}
.tl .ev{position:relative; padding:0 0 17px}
.tl .ev::before{content:''; position:absolute; left:-21px; top:6px; width:9px; height:9px; border-radius:50%;
  background:var(--pri); box-shadow:0 0 0 3px var(--bg)}
.tl .d{font:600 11px var(--mono); color:var(--pri)}
.tl .t{font-size:13.6px; color:var(--ink2); margin-top:3px}

/* Senarai boleh buka */
details.acc{border:1px solid var(--line); border-radius:10px; margin-bottom:9px; background:var(--panel); overflow:hidden}
details.acc summary{padding:12px 14px; cursor:pointer; list-style:none; display:flex; gap:11px; align-items:flex-start; font-size:14px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'+'; margin-left:auto; color:var(--ink3); font-family:var(--mono); flex:none}
details.acc[open] summary::after{content:'−'}
details.acc[open] summary{border-bottom:1px solid var(--line); background:var(--panel2)}
details.acc .body{padding:14px}
.tag{font:600 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; padding:4px 7px; border-radius:5px;
  background:var(--panel2); color:var(--ink2); border:1px solid var(--line); white-space:nowrap; display:inline-block}

.empty{color:var(--ink3); font-size:13.5px; padding:22px; text-align:center}
.mini{font-size:12.3px; color:var(--ink3); margin-top:8px}
.bignum{font:650 clamp(26px,5vw,40px)/1 var(--sans); letter-spacing:-.03em}

/* ================= TELEFON ================= */
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed; inset:0 auto 0 0; width:min(84vw,300px); transform:translateX(-102%);
    transition:transform .22s ease; box-shadow:0 0 60px rgba(0,0,0,.5)}
  .rail.open{transform:none}
  .mburger{display:inline-flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font-size:13px}
  .scrim.on{display:block}
  .baca .row{grid-template-columns:1fr; gap:2px}
  .kpi .v{font-size:22px}
  body{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<script src="/data.js"></script>
<script src="/vb-bar.js"></script>
<div class="wrap">
  <aside class="rail" id="rail">
    <div class="brand">
      <b>Meneroka Laporan RCI Tabung Haji</b>
      <small>Suruhanjaya Siasatan Diraja bagi menyiasat pengurusan dan operasi Lembaga Tabung Haji, 2014–2020. Laporan bertarikh 19 Julai 2022.</small>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="mburger" id="burger" aria-label="Buka menu">☰ Menu</button>
      <div class="grow"></div>
      <button class="chip" id="btnIstilah" title="Senarai istilah dalam bahasa mudah">Kamus istilah</button>
      <button class="chip" id="btnTema" title="Tukar warna paparan">Tema</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/data-core.js?v=2"></script>

<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/lib.js?v=2"></script>
<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/app.js?v=2"></script>
<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/views-1.js?v=2"></script>
<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/views-2.js?v=2"></script>
<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/views-3.js?v=2"></script>
<script src="/eda/rci-th-dashboard/claude-opus-5-high-claude/views-4.js?v=2"></script>
</body>
</html>
