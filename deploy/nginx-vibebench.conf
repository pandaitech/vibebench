server {
    listen 80;
    server_name vibebench.pandaitech.my;

    location /.well-known/acme-challenge/ {
        root /home/dev/vibebench;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vibebench.pandaitech.my;

    root /home/dev/vibebench;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vibebench.pandaitech.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibebench.pandaitech.my/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 302 https://pandaitech.my/vibebench;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
